[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gs-prep-lidar-core"
version = "0.1.0"
description = "Headless point cloud readers and crop exporters for GS-PrepTools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "plyfile>=1.1,<2", "laspy[lazrs,pyproj]>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["lidar_cropper"]
